# ============================================================
# MARKET DATA
# ============================================================

def download_data(period, interval):
    try:
        df = yf.download(
            SYMBOL,
            period=period,
            interval=interval,
            auto_adjust=False,
            progress=False,
            threads=False,
        )

        if df is None or df.empty:
            return None

        if isinstance(df.columns, pd.MultiIndex):
            df.columns = df.columns.get_level_values(0)

        df = df.rename(
            columns={
                "Open": "open",
                "High": "high",
                "Low": "low",
                "Close": "close",
                "Volume": "volume",
            }
        )

        needed = ["open", "high", "low", "close"]
        df = df.dropna(subset=needed).copy()

        for col in needed:
            df[col] = pd.to_numeric(df[col], errors="coerce")

        df = df.dropna()

        return df

    except Exception as e:
        print("Data error:", e)
        return None


def get_timeframes():
    # Weekly / Daily
    w1 = download_data("2y", "1wk")
    d1 = download_data("2y", "1d")

    # Hourly data can be used to derive H4/H1
    h1_raw = download_data("730d", "1h")

    # 15m data is used for M15 and M45
    m15 = download_data("60d", "15m")

    if h1_raw is None or m15 is None:
        return None

    h4 = resample_ohlc(h1_raw, "4h")
    h1 = h1_raw.copy()

    m45 = resample_ohlc(m15, "45min")

    return {
        "1W": w1,
        "1D": d1,
        "4H": h4,
        "1H": h1,
        "45M": m45,
        "15M": m15,
    }


def resample_ohlc(df, rule):
    out = df.resample(rule).agg(
        {
            "open": "first",
            "high": "max",
            "low": "min",
            "close": "last",
        }
    )
    return out.dropna()


# ============================================================
# INDICATORS
# ============================================================

def ema(df, length):
    return df["close"].ewm(span=length, adjust=False).mean()


def atr(df, length=14):
    high_low = df["high"] - df["low"]
    high_close = abs(df["high"] - df["close"].shift())
    low_close = abs(df["low"] - df["close"].shift())

    tr = pd.concat(
        [high_low, high_close, low_close],
        axis=1
    ).max(axis=1)

    return tr.rolling(length).mean()


def add_indicators(df):
    df = df.copy()

    df["ema20"] = ema(df, 20)
    df["ema50"] = ema(df, 50)
    df["ema200"] = ema(df, 200)
    df["atr"] = atr(df)

    df["high20"] = df["high"].rolling(20).max()
    df["low20"] = df["low"].rolling(20).min()

    return df.dropna()


# ============================================================
# TREND
# ============================================================

def trend(df):
    if df is None or len(df) < 210:
        return "UNKNOWN"

    df = add_indicators(df)

    last = df.iloc[-1]

    if (
        last["close"] > last["ema20"]
        and last["ema20"] > last["ema50"]
        and last["ema50"] > last["ema200"]
    ):
        return "BULLISH"

    if (
        last["close"] < last["ema20"]
        and last["ema20"] < last["ema50"]
        and last["ema50"] < last["ema200"]
    ):
        return "BEARISH"

    return "NEUTRAL"


# ============================================================
# SUPPORT / RESISTANCE
# ============================================================

def support_resistance(df, lookback=50):
    recent = df.tail(lookback)

    support = float(recent["low"].min())
    resistance = float(recent["high"].max())

    return support, resistance


# ============================================================
# SUPPLY / DEMAND APPROXIMATION
# ============================================================

def supply_demand(df):
    """
    Mechanical approximation of the Supply/Demand concepts
    from the supplied material.

    This is NOT visual chart drawing. It identifies recent
    consolidation areas followed by strong departures.
    """

    if df is None or len(df) < 30:
        return None

    d = df.copy()

    d["range"] = d["high"] - d["low"]
    d["body"] = abs(d["close"] - d["open"])

    d["avg_range"] = d["range"].rolling(20).mean()

    zones = []

    for i in range(20, len(d) - 3):
        row = d.iloc[i]

        if row["avg_range"] <= 0:
            continue

        # Strong bullish departure = potential demand
        future_high = d["high"].iloc[i + 1:i + 4].max()

        if future_high - row["high"] > row["avg_range"] * 1.5:
            zones.append(
                {
                    "type": "DEMAND",
                    "low": float(row["low"]),
                    "high": float(row["high"]),
                }
            )

        # Strong bearish departure = potential supply
        future_low = d["low"].iloc[i + 1:i + 4].min()

        if row["low"] - future_low > row["avg_range"] * 1.5:
            zones.append(
                {
                    "type": "SUPPLY",
                    "low": float(row["low"]),
                    "high": float(row["high"]),
                }
            )

    return zones[-10:]


def price_in_zone(price, zone):
    return zone["low"] <= price <= zone["high"]


# ============================================================
# CANDLESTICK PATTERNS
# ============================================================

def candle_patterns(df):
    if len(df) < 5:
        return []

    d = df.tail(5)

    patterns = []

    a = d.iloc[-2]
    b = d.iloc[-1]

    body = abs(b["close"] - b["open"])
    candle_range = b["high"] - b["low"]

    if candle_range <= 0:
        return patterns

    upper_wick = b["high"] - max(b["open"], b["close"])
    lower_wick = min(b["open"], b["close"]) - b["low"]

    # Hammer
    if (
        lower_wick >= body * 2
        and upper_wick <= body
        and b["close"] > b["open"]
    ):
        patterns.append("HAMMER")

    # Shooting Star
    if (
        upper_wick >= body * 2
        and lower_wick <= body
        and b["close"] < b["open"]
    ):
        patterns.append("SHOOTING_STAR")

    # Bullish engulfing
    if (
        a["close"] < a["open"]
        and b["close"] > b["open"]
        and b["open"] <= a["close"]
        and b["close"] >= a["open"]
    ):
        patterns.append("BULLISH_ENGULFING")

    # Bearish engulfing
    if (
        a["close"] > a["open"]
        and b["close"] < b["open"]
        and b["open"] >= a["close"]
        and b["close"] <= a["open"]
    ):
        patterns.append("BEARISH_ENGULFING")

    # Doji
    if body <= candle_range * 0.10:
        patterns.append("DOJI")

    # Three White Soldiers
    last3 = d.tail(3)

    if all(last3["close"] > last3["open"]):
        if all(
            last3["close"].iloc[i] > last3["close"].iloc[i - 1]
            for i in range(1, 3)
        ):
            patterns.append("THREE_WHITE_SOLDIERS")

    # Three Black Crows
    if all(last3["close"] < last3["open"]):
        if all(
            last3["close"].iloc[i] < last3["close"].iloc[i - 1]
            for i in range(1, 3)
        ):
            patterns.append("THREE_BLACK_CROWS")

    return patterns


# ============================================================
# BREAKOUT / RETEST
# ============================================================

def breakout_signal(df):
    if df is None or len(df) < 30:
        return "NONE"

    d = df.tail(30)

    previous_resistance = d["high"].iloc[:-1].max()
    previous_support = d["low"].iloc[:-1].min()

    last = d.iloc[-1]

    if last["close"] > previous_resistance:
        return "BULLISH_BREAKOUT"

    if last["close"] < previous_support:
        return "BEARISH_BREAKOUT"

    return "NONE"


# ============================================================
# MULTI-TIMEFRAME ANALYSIS
# ============================================================

def analyze_market(data):
    trends = {}

    for tf, df in data.items():
        if df is not None and len(df) > 30:
            trends[tf] = trend(df)
        else:
            trends[tf] = "UNKNOWN"

    # Higher timeframe direction
    bullish_htf = sum(
        trends[x] == "BULLISH"
        for x in ["1W", "1D", "4H"]
    )

    bearish_htf = sum(
        trends[x] == "BEARISH"
        for x in ["1W", "1D", "4H"]
    )

    if bullish_htf >= 2:
        direction = "BUY"

    elif bearish_htf >= 2:
        direction = "SELL"

    else:
        direction = "WAIT"

    # Entry timeframe
    m15 = data["15M"]

    if m15 is None or len(m15) < 50:
        return {
            "signal": "WAIT",
            "score": 0,
            "reason": ["Not enough M15 data"],
            "trends": trends,
        }

    m15 = add_indicators(m15)

    last_price = float(m15["close"].iloc[-1])

    score = 0
    reasons = []

    # --------------------------------------------------------
    # HTF trend alignment
    # --------------------------------------------------------

    if direction == "BUY":
        score += 2
        reasons.append("HTF bullish alignment")

    elif direction == "SELL":
        score += 2
        reasons.append("HTF bearish alignment")

    # --------------------------------------------------------
    # H1 / 45M alignment
    # --------------------------------------------------------

    if direction == "BUY":
        if trends["1H"] == "BULLISH":
            score += 1
            reasons.append("H1 bullish")

        if trends["45M"] == "BULLISH":
            score += 1
            reasons.append("45M bullish")

    elif direction == "SELL":
        if trends["1H"] == "BEARISH":
            score += 1
            reasons.append("H1 bearish")

        if trends["45M"] == "BEARISH":
            score += 1
            reasons.append("45M bearish")

    # --------------------------------------------------------
    # M15 EMA confirmation
    # --------------------------------------------------------

    last = m15.iloc[-1]

    if direction == "BUY" and last["close"] > last["ema20"]:
        score += 1
        reasons.append("M15 above EMA20")

    if direction == "SELL" and last["close"] < last["ema20"]:
        score += 1
        reasons.append("M15 below EMA20")

    # --------------------------------------------------------
    # Candlestick confirmation
    # --------------------------------------------------------

    patterns = candle_patterns(m15)

    bullish_patterns = {
        "HAMMER",
        "BULLISH_ENGULFING",
        "THREE_WHITE_SOLDIERS",
    }

    bearish_patterns = {
        "SHOOTING_STAR",
        "BEARISH_ENGULFING",
        "THREE_BLACK_CROWS",
    }

    if direction == "BUY":
        matches = bullish_patterns.intersection(patterns)
        if matches:
            score += 2
            reasons.append(
                "Bullish candle: " + ", ".join(matches)
            )

    elif direction == "SELL":
        matches = bearish_patterns.intersection(patterns)
        if matches:
            score += 2
            reasons.append(
                "Bearish candle: " + ", ".join(matches)
            )

    # --------------------------------------------------------
    # Breakout
    # --------------------------------------------------------

    breakout = breakout_signal(m15)

    if direction == "BUY" and breakout == "BULLISH_BREAKOUT":
        score += 1
        reasons.append("M15 bullish breakout")

    elif direction == "SELL" and breakout == "BEARISH_BREAKOUT":
        score += 1
        reasons.append("M15 bearish breakout")

    # --------------------------------------------------------
    # Supply / Demand location
    # --------------------------------------------------------

    zones = supply_demand(data["1H"])

    zone_match = None

    if zones:
        for zone in reversed(zones):
            if price_in_zone(last_price, zone):
                zone_match = zone
                break

    if zone_match:
        if (
            direction == "BUY"
            and zone_match["type"] == "DEMAND"
        ):
            score += 2
            reasons.append("Price at demand zone")

        elif (
            direction == "SELL"
            and zone_match["type"] == "SUPPLY"
        ):
            score += 2
            reasons.append("Price at supply zone")

    # --------------------------------------------------------
    # Final decision
    # --------------------------------------------------------

    signal = "WAIT"

    if direction in ["BUY", "SELL"] and score >= MIN_SCORE:
        signal = direction

    return {
        "signal": signal,
        "score": score,
        "price": last_price,
        "patterns": patterns,
        "breakout": breakout,
        "zone": zone_match,
        "trends": trends,
        "reason": reasons,
    }


# ============================================================
# RISK MANAGEMENT
# ============================================================

def calculate_trade(analysis, data):
    if analysis["signal"] == "WAIT":
        return None

    direction = analysis["signal"]
    price = analysis["price"]

    m15 = add_indicators(data["15M"])

    atr_value = float(m15["atr"].iloc[-1])

    if not np.isfinite(atr_value) or atr_value <= 0:
        return None

    # ATR-based technical stop approximation
    stop_distance = atr_value * 1.5

    if direction == "BUY":
        sl = price - stop_distance
        tp1 = price + stop_distance * 2
        tp2 = price + stop_distance * 3
        tp3 = price + stop_distance * 4

    else:
        sl = price + stop_distance
        tp1 = price - stop_distance * 2
        tp2 = price - stop_distance * 3
        tp3 = price - stop_distance * 4

    return {
        "direction": direction,
        "entry": price,
        "sl": sl,
        "tp1": tp1,
        "tp2": tp2,
        "tp3": tp3,
        "rr1": 2.0,
        "rr2": 3.0,
        "rr3": 4.0,
    }


# ============================================================
# TELEGRAM MESSAGE
# ============================================================

def build_message(analysis, trade):
    signal = analysis["signal"]

    if signal == "WAIT":
        return None

    emoji = "🟢" if signal == "BUY" else "🔴"

    trends = analysis["trends"]

    pattern_text = ", ".join(
        analysis.get("patterns", [])
    ) or "None"

    reasons = "\n".join(
        f"• {x}" for x in analysis["reason"]
    )

    return f"""
<b>🤖 FOREX AI SIGNAL</b>

{emoji} <b>{signal} {DISPLAY_SYMBOL}</b>

<b>Confluence:</b> {analysis["score"]}/{MIN_SCORE}

<b>Multi-Timeframe</b>
1W: {trends["1W"]}
1D: {trends["1D"]}
4H: {trends["4H"]}
1H: {trends["1H"]}
45M: {trends["45M"]}
15M: {trends["15M"]}

<b>Entry:</b> {trade["entry"]:.2f}
<b>SL:</b> {trade["sl"]:.2f}

<b>TP1:</b> {trade["tp1"]:.2f}  (2R)
<b>TP2:</b> {trade["tp2"]:.2f}  (3R)
<b>TP3:</b> {trade["tp3"]:.2f}  (4R)

<b>Candles:</b> {pattern_text}

<b>Why:</b>
{reasons}

⚠️ Paper/backtest engine.
No profit guarantee.
"""


# ============================================================
# DUPLICATE SIGNAL PROTECTION
# ============================================================

LAST_SIGNAL = None


def signal_key(analysis, trade):
    if trade is None:
        return None

    return (
        analysis["signal"],
        round(trade["entry"], 2),
        round(trade["sl"], 2),
        round(trade["tp1"], 2),
    )


# ============================================================
# MAIN
# ============================================================

def main():
    global LAST_SIGNAL

    print("=" * 60)
    print("FOREX AI BOT")
    print(datetime.now(timezone.utc).isoformat())
    print("=" * 60)

    data = get_timeframes()

    if data is None:
        telegram(
            "⚠️ <b>FOREX AI BOT</b>\n\n"
            "Market data could not be downloaded."
        )
        return

    analysis = analyze_market(data)

    print("Signal:", analysis["signal"])
    print("Score:", analysis["score"])
    print("Trends:", analysis["trends"])

    if analysis["signal"] == "WAIT":
        print("No valid setup.")
        return

    trade = calculate_trade(analysis, data)

    if trade is None:
        print("Trade calculation failed.")
        return

    key = signal_key(analysis, trade)

    if key == LAST_SIGNAL:
        print("Duplicate signal ignored.")
        return

    message = build_message(analysis, trade)

    if message:
        if telegram(message):
            LAST_SIGNAL = key
            print("Signal sent to Telegram.")


if __name__ == "__main__":
    main()
